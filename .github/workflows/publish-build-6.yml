name: Publish Build 6

on:
  push:
    tags:
      - build-6

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish verified pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          release-assets/Sabaq-Workspace-Build-6.apk
          release-assets/Sabaq-Workspace-Build-6-Source.zip
          --title "Sabaq Workspace — Build 6"
          --notes-file release-assets/RELEASE-NOTES-BUILD-6.md
          --prerelease
          --verify-tag
