name: Publish Build 9

on:
  push:
    tags:
      - build-9

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish verified pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          release-assets/Sabaq-Workspace-Build-9.apk
          --title "Sabaq Workspace — Build 9"
          --notes-file release-assets/RELEASE-NOTES-BUILD-9.md
          --prerelease
          --verify-tag
