name: Publish Build 7

on:
  push:
    tags:
      - build-7

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish verified pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          release-assets/Sabaq-Workspace-Build-7.apk
          --title "Sabaq Workspace — Build 7"
          --notes-file release-assets/RELEASE-NOTES-BUILD-7.md
          --prerelease
          --verify-tag
